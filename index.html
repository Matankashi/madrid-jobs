<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>תיק העבודה — מדריד</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    authDomain: "madrid-jobs.firebaseapp.com",
    databaseURL: "https://madrid-jobs-default-rtdb.firebaseio.com",
    projectId: "madrid-jobs",
    storageBucket: "madrid-jobs.firebasestorage.app",

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg: #ece6d8;
    --surface: #f6f2e7;
    --surface-2: #ffffff;
    --border: #d9cfb8;
    --border-soft: #e2d9c4;
    --text: #26201a;
    --text-muted: #6b5f4d;
    --text-faint: #94856d;
    --gold: #a9822a;
    --gold-dim: #8a6a20;
    --gold-soft: rgba(169,130,42,0.14);
    --wine: #7c2634;
    --wine-dim: #611d28;
    --wine-soft: rgba(124,38,52,0.10);
    --ink: #2c6a56;
    --ink-dim: #235846;
    --ink-soft: rgba(44,106,86,0.12);
    --danger: #a13a2f;
    --danger-soft: rgba(161,58,47,0.10);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #151210;
      --surface: #1d1814;
      --surface-2: #251f19;
      --border: #3b3226;
      --border-soft: #2c261e;
      --text: #f2ece0;
      --text-muted: #ad9c85;
      --text-faint: #7c6e5b;
      --gold: #d3ab48;
      --gold-dim: #b28e37;
      --gold-soft: rgba(211,171,72,0.16);
      --wine: #c85a68;
      --wine-dim: #a84653;
      --wine-soft: rgba(200,90,104,0.14);
      --ink: #5fae93;
      --ink-dim: #4a9179;
      --ink-soft: rgba(95,174,147,0.14);
      --danger: #e0776a;
      --danger-soft: rgba(224,119,106,0.14);
    }
  }
  :root[data-theme="dark"]{
    --bg: #151210;
    --surface: #1d1814;
    --surface-2: #251f19;
    --border: #3b3226;
    --border-soft: #2c261e;
    --text: #f2ece0;
    --text-muted: #ad9c85;
    --text-faint: #7c6e5b;
    --gold: #d3ab48;
    --gold-dim: #b28e37;
    --gold-soft: rgba(211,171,72,0.16);
    --wine: #c85a68;
    --wine-dim: #a84653;
    --wine-soft: rgba(200,90,104,0.14);
    --ink: #5fae93;
    --ink-dim: #4a9179;
    --ink-soft: rgba(95,174,147,0.14);
    --danger: #e0776a;
    --danger-soft: rgba(224,119,106,0.14);
  }

  *{ box-sizing: border-box; }
  ::selection{ background: var(--gold-soft); color: var(--text); }

  html, body{ margin:0; background: var(--bg); color: var(--text); }
  body{
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 48px 20px 72px;
  }

  input, select, textarea, button{ font-family: inherit; }

  .page{ max-width: 820px; margin: 0 auto; }

  .loading{
    max-width: 820px; margin: 120px auto; text-align:center;
    color: var(--text-muted); font-size: 14px;
  }

  /* ---------- auth ---------- */
  .auth-wrap{
    min-height: 80vh; display:flex; align-items:center; justify-content:center;
  }
  .auth-card{
    background: var(--surface); border:1px solid var(--border); border-radius:16px;
    padding: 32px 30px; width: 100%; max-width: 360px; text-align:center;
    position: relative;
  }
  .auth-card .seal{ margin: 0 auto 14px; }
  .auth-card h1{
    font-family:'Fraunces', serif; font-weight:800; font-size:24px; margin: 0 0 6px;
  }
  .auth-sub{ font-size:13px; color: var(--text-muted); margin: 0 0 22px; line-height:1.6; }
  .auth-card form{ display:flex; flex-direction:column; gap:12px; text-align:right; }
  .auth-card label{ font-size:12px; color: var(--text-muted); margin-bottom:-6px; }
  .auth-card input{
    background: var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; font-size:14px; color: var(--text);
  }
  .auth-card input:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
  .auth-error{
    font-size:12.5px; color: var(--danger); background: var(--danger-soft);
    border-radius:8px; padding:8px 10px; text-align:right;
  }
  .auth-card button[type="submit"]{
    margin-top:4px; background: var(--wine); color: var(--surface); border:none;
    border-radius:999px; padding:11px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .auth-card button[type="submit"]:disabled{ opacity:0.6; cursor:default; }
  .auth-toggle{
    margin-top:16px; background:none; border:none; color: var(--ink-dim);
    font-size:12.5px; cursor:pointer; text-decoration:underline;
  }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
    font-size:12px; color: var(--text-faint);
  }
  .topbar .linklike{
    background:none; border:none; color: var(--text-faint); font-size:12px; cursor:pointer;
    text-decoration:underline; padding:0; font-family:'IBM Plex Mono',monospace;
  }
  .user-email{ font-family:'IBM Plex Mono', monospace; direction:ltr; }

  /* ---------- cover ---------- */
  .cover{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 30px 32px 26px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .cover::before{
    content:'';
    position:absolute; inset: 8px;
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
    pointer-events:none;
  }
  .cover-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:18px; flex-wrap:wrap;
  }
  .cover h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-optical-sizing: auto;
    font-size: clamp(28px, 5vw, 40px);
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    text-wrap: balance;
    color: var(--text);
  }
  .cover .sub{
    margin:0; font-size:14px; color: var(--text-muted); line-height:1.7; max-width: 46ch;
  }
  .cover .sub b{ color: var(--wine); font-weight:600; }

  .seal{
    flex-shrink:0;
    width: 84px; height:84px;
    border-radius:50%;
    border: 2px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    color: var(--ink);
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    line-height:1.35;
    letter-spacing: 0.02em;
    transform: rotate(-8deg);
    position: relative;
  }
  .seal::before{
    content:'';
    position:absolute; inset:5px;
    border: 1px dashed var(--ink);
    border-radius:50%;
  }
  .seal b{ display:block; font-size:15px; font-family:'Fraunces',serif; font-weight:800; margin-bottom:2px; }
  .seal.small{ width:64px; height:64px; font-size:8.5px; }
  .seal.small b{ font-size:12px; }

  .stats{
    display:grid; grid-template-columns: repeat(3,1fr);
    gap:1px; background: var(--border);
    border:1px solid var(--border); border-radius:12px; overflow:hidden;
    margin-top:22px;
  }
  .stat{ background: var(--surface-2); padding:14px 16px; }
  .stat .num{
    font-family:'Fraunces', serif; font-weight:800; font-size:24px; line-height:1;
    font-variant-numeric: tabular-nums; color: var(--text);
  }
  .stat .label{ display:block; margin-top:6px; font-size:11.5px; color: var(--text-faint); }

  .updated-row{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    margin-top:18px; padding-top:14px; border-top:1px dashed var(--border);
    font-size:12.5px; color: var(--text-faint);
  }
  .updated-row b{ color: var(--text); font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .edit-toggle{
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;
    color: var(--gold-dim); background: var(--gold-soft); border:1px solid var(--gold-soft);
    border-radius:999px; padding:6px 12px; cursor:pointer;
  }
  .updated-row .btn-row{ display:flex; gap:8px; }
  .search-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;
    color: var(--ink-dim); background: var(--ink-soft); border:1px solid var(--ink-soft);
    border-radius:999px; padding:6px 12px; cursor:pointer;
  }
  .search-btn:disabled{ opacity:0.6; cursor:default; }
  .search-error{
    font-size:12.5px; color: var(--danger); background: var(--danger-soft);
    border-radius:8px; padding:10px 12px; margin-bottom:14px;
  }

  /* ---------- sections ---------- */
  section.group{ margin-bottom: 34px; }
  .group-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:14px; padding-bottom:8px;
    border-bottom: 1px solid var(--border);
  }
  .group-head .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    padding:3px 8px; border-radius:5px; white-space:nowrap;
  }
  .tag.it{ background: var(--ink-soft); color: var(--ink-dim); }
  .tag.dog{ background: var(--gold-soft); color: var(--gold-dim); }
  .tag.food{ background: var(--wine-soft); color: var(--wine-dim); }
  .tag.sec{ background: var(--surface-2); color: var(--text-muted); border:1px solid var(--border); }

  .group-head h2{
    font-family:'Fraunces', serif; font-weight:700; font-size:19px; margin:0; color: var(--text);
  }
  .group-head .count{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color: var(--text-faint); margin-inline-start:auto;
  }

  .cards{ display:flex; flex-direction:column; gap:12px; }

  .empty-cat{
    font-size:13px; color: var(--text-faint); font-style:italic; padding:6px 2px;
  }

  .card{
    background: var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    display:grid;
    grid-template-columns: 1fr auto;
    gap: 14px 18px;
    align-items:center;
  }

  .card-main{ min-width:0; }
  .card-title{
    font-family:'Fraunces', serif; font-weight:700; font-size:16.5px; line-height:1.35;
    color: var(--text); margin:0 0 3px; text-wrap: balance;
    direction: ltr; text-align: right; unicode-bidi: isolate;
  }
  .card-company{
    font-size:12.5px; color: var(--text-muted); margin-bottom:8px;
    direction: ltr; text-align: right; unicode-bidi: isolate;
  }
  .card-company b{ color: var(--text); font-weight:600; }

  .card-desc{
    font-size:13px; color: var(--text-muted); line-height:1.6;
    margin: 0 0 10px;
  }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color: var(--text-muted);
    background: var(--surface-2);
    border:1px solid var(--border-soft);
    border-radius:6px;
    padding:3px 8px;
    white-space:nowrap;
  }

  .card-cta{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    flex-shrink:0;
  }
  .card-cta a{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; font-weight:600;
    color: var(--wine);
    text-decoration:none;
    border: 1.5px solid var(--wine);
    border-radius: 999px;
    padding: 8px 14px;
    white-space:nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .card-cta a:hover{ background: var(--wine); color: var(--surface); }
  .card-cta a:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  .del-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--danger);
    background: var(--danger-soft); border:1px solid var(--danger-soft); border-radius:999px;
    padding:5px 12px; cursor:pointer; white-space:nowrap;
  }

  /* ---------- found results (live search) ---------- */
  .found-section .group-head{ border-bottom-color: var(--ink-soft); }
  .found-card{
    background: var(--surface); border:1px dashed var(--ink); border-radius:12px;
    padding:14px 16px; display:grid; grid-template-columns: 1fr auto; gap:12px 16px; align-items:center;
  }
  .found-card .card-title{ font-size:15px; }
  .add-found-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;
    color: var(--ink-dim); background: var(--ink-soft); border:1px solid var(--ink-soft);
    border-radius:999px; padding:7px 13px; cursor:pointer; white-space:nowrap;
  }
  .add-found-btn:disabled{ opacity:0.55; cursor:default; }
  .found-select{
    background: var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:5px 8px; font-size:11.5px; color: var(--text); margin-inline-end:6px;
  }

  /* ---------- add form ---------- */
  .add-form-section .group-head{ border-bottom-color: var(--gold-soft); }
  .add-form{
    background: var(--surface); border:1px dashed var(--gold-dim); border-radius:12px;
    padding:18px; display:grid; grid-template-columns: 1fr 1fr; gap:12px;
  }
  .add-form .full{ grid-column: 1 / -1; }
  .add-form label{ display:flex; flex-direction:column; gap:5px; font-size:12px; color: var(--text-muted); }
  .add-form input, .add-form select, .add-form textarea{
    background: var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:9px 11px; font-size:13.5px; color: var(--text);
  }
  .add-form textarea{ resize: vertical; min-height:44px; }
  .add-form button{
    grid-column: 1 / -1; justify-self:start;
    background: var(--gold-dim); color: var(--surface); border:none; border-radius:999px;
    padding:10px 20px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .add-form button:disabled{ opacity:0.6; cursor:default; }

  @media (max-width: 560px){
    .card{ grid-template-columns: 1fr; }
    .card-cta{ align-items:flex-start; flex-direction:row; }
    .stats{ grid-template-columns: 1fr; }
    .cover-top{ flex-direction: column-reverse; }
    .add-form{ grid-template-columns: 1fr; }
  }

  .foot{
    margin-top: 40px; padding-top: 18px; border-top:1px solid var(--border);
    font-size: 13px; color: var(--text-faint); line-height: 1.85;
  }
  .foot b{ color: var(--text-muted); font-weight:600; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const db = firebase.database();
    const PROXY_URL = "https://madrid-jobs-proxy.matankashi.workers.dev";

    const CATS = [
      { key:'it',   tag:'it',   tagLabel:'IT',      label:'תפקידי טכנולוגיה', query:'software' },
      { key:'dog',  tag:'dog',  tagLabel:'אילוף',   label:'אילוף כלבים',      query:'adiestrador canino' },
      { key:'food', tag:'food', tagLabel:'בריסטה',  label:'קפה ובריסטה',      query:'barista' },
      { key:'sec',  tag:'sec',  tagLabel:'אבטחה',   label:'אבטחה',            query:'vigilante seguridad' },
    ];

    function emptyForm(){
      return { category:'it', title:'', company:'', loc:'', desc:'', link:'', chipsText:'' };
    }

    function AuthGate(){
      const [mode, setMode] = useState('signin');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      function submit(e){
        e.preventDefault();
        setError('');
        setLoading(true);
        const action = mode === 'signin'
          ? firebase.auth().signInWithEmailAndPassword(email, password)
          : firebase.auth().createUserWithEmailAndPassword(email, password);
        action
          .catch(err => setError(err.message))
          .finally(() => setLoading(false));
      }

      return (
        <div className="auth-wrap" dir="rtl" lang="he">
          <div className="auth-card">
            <div className="seal small"><b>EU/ES</b>גישה<br/>מאובטחת</div>
            <h1>תיק העבודה</h1>
            <p className="auth-sub">התחברות אישית — הנתונים שמורים ב-Firebase נפרד, לא משותפים עם אפליקציות אחרות.</p>
            <form onSubmit={submit}>
              <label htmlFor="auth-email">אימייל</label>
              <input id="auth-email" type="email" value={email} autoFocus required
                     onChange={e => setEmail(e.target.value)} />
              <label htmlFor="auth-pass">סיסמה</label>
              <input id="auth-pass" type="password" value={password} required minLength={6}
                     onChange={e => setPassword(e.target.value)} />
              {error && <div className="auth-error">{error}</div>}
              <button type="submit" disabled={loading}>
                {loading ? '…' : (mode === 'signin' ? 'התחברות' : 'יצירת חשבון')}
              </button>
            </form>
            <button className="auth-toggle" onClick={() => { setMode(mode === 'signin' ? 'signup' : 'signin'); setError(''); }}>
              {mode === 'signin' ? 'אין לי חשבון עדיין — הרשמה' : 'כבר יש לי חשבון — התחברות'}
            </button>
          </div>
        </div>
      );
    }

    function Dossier({ user }){
      const [meta, setMeta] = useState(null);
      const [listings, setListings] = useState(null);
      const [editMode, setEditMode] = useState(false);
      const [form, setForm] = useState(emptyForm());
      const [saving, setSaving] = useState(false);
      const [searching, setSearching] = useState(false);
      const [searchError, setSearchError] = useState('');
      const [searchResults, setSearchResults] = useState(null);
      const [addingKey, setAddingKey] = useState(null);

      useEffect(() => {
        const ref = db.ref();
        const cb = snap => {
          const val = snap.val() || {};
          setMeta(val.meta || null);
          setListings(val.listings || {});
        };
        ref.on('value', cb);
        return () => ref.off('value', cb);
      }, []);

      function touchUpdated(){
        db.ref('meta/lastUpdated').set(new Date().toISOString());
      }

      function addJob(e){
        e.preventDefault();
        if(!form.title.trim() || !form.company.trim() || !form.link.trim()) return;
        setSaving(true);
        const chips = form.chipsText.split(',').map(s => s.trim()).filter(Boolean);
        db.ref('listings').push({
          category: form.category,
          title: form.title.trim(),
          company: form.company.trim(),
          loc: form.loc.trim(),
          desc: form.desc.trim(),
          link: form.link.trim(),
          chips,
          dateAdded: new Date().toISOString().slice(0, 10),
        }).then(() => { touchUpdated(); setForm(emptyForm()); })
          .finally(() => setSaving(false));
      }

      function removeJob(id){
        if(!window.confirm('להסיר את המשרה הזו מהרשימה?')) return;
        db.ref('listings/' + id).remove().then(touchUpdated);
      }

      async function runSearch(){
        setSearching(true);
        setSearchError('');
        setSearchResults(null);
        const byCat = {};
        let anyOk = false;
        for(const c of CATS){
          try{
            const url = `${PROXY_URL}/search?what=${encodeURIComponent(c.query)}&where=Madrid`;
            const res = await fetch(url);
            const data = await res.json();
            if(res.ok){
              byCat[c.key] = (data.results || []).slice(0, 6);
              anyOk = true;
            } else {
              byCat[c.key] = [];
            }
          } catch(err){
            byCat[c.key] = [];
          }
        }
        if(anyOk){
          setSearchResults(byCat);
        } else {
          setSearchError('החיפוש נכשל. נסו שוב בעוד רגע.');
        }
        setSearching(false);
      }

      function addFoundJob(catKey, job){
        const jobKey = catKey + job.id;
        setAddingKey(jobKey);
        const chips = [];
        if(job.salary_min) chips.push(`שכר: ${Math.round(job.salary_min).toLocaleString()}–${Math.round(job.salary_max || job.salary_min).toLocaleString()}€`);
        db.ref('listings').push({
          category: catKey,
          title: job.title || '',
          company: job.company || '',
          loc: job.location || '',
          desc: '',
          link: job.link || '',
          chips,
          dateAdded: new Date().toISOString().slice(0, 10),
        }).then(() => {
          touchUpdated();
          setSearchResults(prev => {
            if(!prev) return prev;
            const next = { ...prev };
            next[catKey] = next[catKey].filter(j => j.id !== job.id);
            return next;
          });
        }).finally(() => setAddingKey(null));
      }

      if(listings === null){
        return <div className="loading" dir="rtl" lang="he">טוען משרות…</div>;
      }

      const listArr = Object.entries(listings).map(([id, j]) => ({ id, ...j }));
      const grouped = CATS.map(c => ({ ...c, jobs: listArr.filter(j => j.category === c.key) }));
      const total = listArr.length;
      const activeCats = grouped.filter(g => g.jobs.length > 0).length;
      const noExp = listArr.filter(j => (j.chips || []).some(c => c.includes('לא נדרש'))).length;
      const lastUpdatedLabel = meta && meta.lastUpdated
        ? new Date(meta.lastUpdated).toLocaleDateString('he-IL', { day:'2-digit', month:'2-digit', year:'numeric' })
        : '—';

      return (
        <div className="page" dir="rtl" lang="he">
          <div className="topbar">
            <span className="user-email">{user.email}</span>
            <button className="linklike" onClick={() => firebase.auth().signOut()}>התנתקות</button>
          </div>

          <div className="cover">
            <div className="cover-top">
              <div>
                <h1>תיק העבודה — מדריד</h1>
                <p className="sub">משרות אמיתיות שאותרו ברשת עבור <b>בעלי דרכון ספרדי / אירופי</b> — אין צורך באשרת עבודה או ספונסרשיפ.</p>
              </div>
              <div className="seal"><b>EU/ES</b>ללא&nbsp;צורך<br/>באשרה</div>
            </div>
            <div className="stats">
              <div className="stat"><span className="num">{total}</span><span className="label">משרות ברשימה</span></div>
              <div className="stat"><span className="num">{activeCats}</span><span className="label">תחומים פעילים מתוך {CATS.length}</span></div>
              <div className="stat"><span className="num">{noExp}</span><span className="label">ללא ניסיון קודם נדרש</span></div>
            </div>
            <div className="updated-row">
              <span>עודכן לאחרונה: <b>{lastUpdatedLabel}</b></span>
              <div className="btn-row">
                <button className="search-btn" onClick={runSearch} disabled={searching}>
                  {searching ? 'מחפש…' : '🔍 חפש משרות חדשות'}
                </button>
                <button className="edit-toggle" onClick={() => setEditMode(v => !v)}>
                  {editMode ? 'סיום עריכה' : '✎ מצב עריכה'}
                </button>
              </div>
            </div>
          </div>

          {searchError && <div className="search-error">{searchError}</div>}

          {searchResults && (
            <section className="group found-section">
              <div className="group-head">
                <span className="tag it">חדש</span>
                <h2>נמצאו ברשת</h2>
                <span className="count">חיפוש חי דרך Adzuna</span>
              </div>
              {CATS.map(c => {
                const existingLinks = new Set(listArr.map(j => j.link));
                const jobs = (searchResults[c.key] || []).filter(j => !existingLinks.has(j.link));
                if(jobs.length === 0) return null;
                return (
                  <div key={c.key} style={{ marginBottom: 16 }}>
                    <div className="group-head" style={{ marginBottom: 8, paddingBottom: 4 }}>
                      <span className={`tag ${c.tag}`}>{c.tagLabel}</span>
                      <h2 style={{ fontSize: 15 }}>{c.label}</h2>
                    </div>
                    <div className="cards">
                      {jobs.map(job => (
                        <div className="found-card" key={job.id}>
                          <div className="card-main">
                            <div className="card-title">{job.title}</div>
                            <div className="card-company"><b>{job.company}</b>{job.location ? ` · ${job.location}` : ''}</div>
                          </div>
                          <div className="card-cta">
                            <a href={job.link} target="_blank" rel="noopener">לצפייה ←</a>
                            <button className="add-found-btn" disabled={addingKey === c.key + job.id}
                                    onClick={() => addFoundJob(c.key, job)}>
                              {addingKey === c.key + job.id ? 'מוסיף…' : '+ הוספה לרשימה'}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </section>
          )}

          {grouped.map(g => (
            <section className="group" key={g.key}>
              <div className="group-head">
                <span className={`tag ${g.tag}`}>{g.tagLabel}</span>
                <h2>{g.label}</h2>
                <span className="count">{g.jobs.length} משרות</span>
              </div>
              <div className="cards">
                {g.jobs.length === 0 && <div className="empty-cat">אין כרגע משרות בקטגוריה הזו</div>}
                {g.jobs.map(job => (
                  <div className="card" key={job.id}>
                    <div className="card-main">
                      <div className="card-title">{job.title}</div>
                      <div className="card-company"><b>{job.company}</b>{job.loc ? ` · ${job.loc}` : ''}</div>
                      {job.desc && <div className="card-desc">{job.desc}</div>}
                      <div className="chips">
                        {(job.chips || []).map((c, i) => <span className="chip" key={i}>{c}</span>)}
                      </div>
                    </div>
                    <div className="card-cta">
                      <a href={job.link} target="_blank" rel="noopener">לצפייה במשרה ←</a>
                      {editMode && <button className="del-btn" onClick={() => removeJob(job.id)}>✕ הסרה</button>}
                    </div>
                  </div>
                ))}
              </div>
            </section>
          ))}

          {editMode && (
            <section className="group add-form-section">
              <div className="group-head"><h2>הוספת משרה חדשה</h2></div>
              <form className="add-form" onSubmit={addJob}>
                <label>תחום
                  <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>
                    {CATS.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}
                  </select>
                </label>
                <label>קישור למשרה
                  <input type="url" required placeholder="https://…" value={form.link}
                         onChange={e => setForm({ ...form, link: e.target.value })} />
                </label>
                <label>תפקיד
                  <input required placeholder="שם התפקיד (בשפת המקור)" value={form.title}
                         onChange={e => setForm({ ...form, title: e.target.value })} />
                </label>
                <label>חברה
                  <input required placeholder="שם החברה" value={form.company}
                         onChange={e => setForm({ ...form, company: e.target.value })} />
                </label>
                <label>מיקום
                  <input placeholder="למשל: מדריד · היברידי" value={form.loc}
                         onChange={e => setForm({ ...form, loc: e.target.value })} />
                </label>
                <label>תגיות (מופרדות בפסיק)
                  <input placeholder="רמה: Junior, שכר: 25,000€" value={form.chipsText}
                         onChange={e => setForm({ ...form, chipsText: e.target.value })} />
                </label>
                <label className="full">תיאור קצר בעברית
                  <textarea value={form.desc} onChange={e => setForm({ ...form, desc: e.target.value })} />
                </label>
                <button type="submit" disabled={saving}>{saving ? 'שומר…' : '+ הוספת משרה'}</button>
              </form>
            </section>
          )}

          <div className="foot">
            <b>מה זה ומה לא:</b> כפתור <b>"חפש משרות חדשות"</b> מריץ חיפוש חי מול Adzuna (דרך פרוקסי פרטי) ומציג תוצאות טריות — אתם בוחרים מה להוסיף לרשימה. תוצאות מהחיפוש אינן מתורגמות/מסוננות אוטומטית, אז כדאי לבדוק כל משרה לפני הוספה. הרשימה עצמה נשמרת ב-Firebase; קישורים חיצוניים עלולים לפוג עם הזמן.
          </div>
        </div>
      );
    }

    function App(){
      const [user, setUser] = useState(undefined);
      useEffect(() => {
        const unsub = firebase.auth().onAuthStateChanged(u => setUser(u));
        return unsub;
      }, []);
      if(user === undefined) return <div className="loading" dir="rtl" lang="he">טוען…</div>;
      if(!user) return <AuthGate />;
      return <Dossier user={user} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
